when:
  - event: push
    #branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual

matrix:
  include:
    - HOST: sunhome
      KNOWN_HOSTS: |
        # sunhome.atlas-ide.ts.net:22 SSH-2.0-OpenSSH_10.3
        # sunhome.atlas-ide.ts.net:22 SSH-2.0-OpenSSH_10.3
        # sunhome.atlas-ide.ts.net:22 SSH-2.0-OpenSSH_10.3
        sunhome.atlas-ide.ts.net ssh-rsa 
        # sunhome.atlas-ide.ts.net:22 SSH-2.0-OpenSSH_10.3
        # sunhome.atlas-ide.ts.net:22 SSH-2.0-OpenSSH_10.3
        sunhome.atlas-ide.ts.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDJ+67VaBsHroNd2xoC5gC7WkpVnV6UtGd7KSr+ROj+R

steps:
  - name: deploy-${HOST}
    image: docker.io/library/alpine:latest
    environment:
      ID_ED25519:
        from_secret: id_ed25519
    commands:
      - apk add git openssh
      - mkdir -p ~/.ssh
      - echo "$ID_ED25519" > ~/.ssh/id_ed25519
      - printf ${KNOWN_HOSTS} > ~/.ssh/known_hosts
      - chmod 700 ~/.ssh
      - chmod 600 ~/.ssh/*
      - tmpdir=$(mktemp -u)
      - rev=$(git rev-parse HEAD)
      - ssh automata@${HOST}.atlas-ide.ts.net bash -lc "sudo nixos-rebuild switch --flake git+https://github.com/TransCommune/universe.git#$rev"
